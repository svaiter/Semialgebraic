name = "Semialgebraic"
defaultTargets = ["Semialgebraic"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Semialgebraic"

# Mathlib is pinned to the commit recorded in TauCeti's manifest at the pinned TauCeti commit,
# so that both olean caches hit.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "2c9b12be26ca8efd0c54851aead7b7a6553f7f5c"

# Compile-time checks that the interface theorems have the shape of the HardnessBilevel assumption classes.
[[lean_lib]]
name = "SemialgebraicCheck"
globs = ["SemialgebraicCheck.+"]
